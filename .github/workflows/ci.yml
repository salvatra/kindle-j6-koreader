name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Repository and helper checks (no hardware)
        run: |
          python3 tools/check_repo.py
          python3 -m unittest discover -s tests -v
      - name: Pinned baseline, patched tests and ARM build
        run: python3 tools/reproduce.py
      - name: Keep generated files out of Git
        run: git diff --exit-code
